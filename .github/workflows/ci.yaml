name: Veil (build and test)

on:
  push:
    branches: [ master ]
    paths:
      - '**/*.go'
      - 'bpf/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [ master ]
    paths:
      - '**/*.go'
      - 'bpf/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/ci.yaml'

jobs:
  # staticcheck finds the class of defect this codebase has produced by
  # hand: swallowed errors, unused declarations. It also honours the go
  # directive in go.mod, so it reports stdlib APIs newer than Go 1.18 --
  # something the compiler does not do, and the reason exterrs.Join exists.
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.18'

      # Pinned: current staticcheck needs a newer Go than this module
      # targets to build itself. 2022.1.3 is the last line that supports
      # analysing Go 1.18. install-go is false so it uses the Go above.
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2022.1.3"
          install-go: false
          build-tags: integration

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.18'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race unconditionally here: unit tests carry no wall-clock
      # assertions for it to weaken, and -covermode=atomic is already the
      # mode the race detector requires.
      - name: Test
        run: go test -v -count=1 -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out
          fi

      - name: Generate html coverage report
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -html=coverage.out -o coverage.html
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 10

  # Loads the committed BPF objects into a real kernel and drives a real
  # workload. Run on both architectures: the BPF objects and the syscall
  # number tables are per-arch, and a wrong one fails silently rather than
  # refusing to load.
  integration:
    strategy:
      # Report both architectures. Cancelling the sibling on first failure
      # would hide whether a problem is arch-specific, which is the whole
      # reason for running both.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}
    name: integration (${{ matrix.arch }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.18'

      # Recorded because a failure here is usually environmental: a kernel
      # without BTF, or a hook that does not exist on this release.
      - name: Environment
        run: |
          uname -a
          echo "arch: $(dpkg --print-architecture)"
          test -r /sys/kernel/btf/vmlinux \
            && echo "kernel BTF: present" \
            || echo "kernel BTF: MISSING (CO-RE relocation will fail)"

      # Build constraints must have picked this runner's objects. Selecting
      # the other architecture's would still load and run, just read the
      # wrong registers, so make the choice visible.
      - name: Confirm the per-arch artifacts selected
        run: |
          go list -f '{{.Dir}} {{.GoFiles}}' ./modules/... | tr ' ' '\n' \
            | grep -E '(_bpfe.*|syscall_table_.*)\.go$' | sort -u

      - name: Integration tests
        run: |
          go test -tags integration -exec sudo -count=1 -v -timeout 10m \
            -coverprofile=coverage-integration.out -covermode=atomic ./modules/...

      - name: Integration coverage summary
        run: go tool cover -func=coverage-integration.out | tail -20

      - name: Generate html coverage report
        run: go tool cover -html=coverage-integration.out -o coverage-integration.html

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-${{ matrix.arch }}
          path: |
            coverage-integration.out
            coverage-integration.html
          retention-days: 10

      # Run again under the race detector. Kept as a second pass because
      # -race slows Go-side execution, and the negative assertions are
      # fixed wall-clock windows: under -race "no event arrived" is easier
      # to satisfy, so this run is weaker evidence for those and stronger
      # for everything concurrent. arm64's weaker memory ordering makes it
      # the more interesting of the two to cover.
      - name: Integration tests (race detector)
        run: go test -tags integration -exec sudo -count=1 -race -timeout 15m ./modules/...
